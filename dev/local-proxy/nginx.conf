# Run from the repository root:
# mkdir -p /tmp/promptally-local-nginx-body
# nginx -p "$PWD/dev/local-proxy/" -c nginx.conf
worker_processes 1;
pid /tmp/promptally-local-nginx.pid;
error_log /tmp/promptally-local-nginx-error.log;

events {
    worker_connections 256;
}

http {
    access_log /tmp/promptally-local-nginx-access.log;
    client_body_temp_path /tmp/promptally-local-nginx-body;

    map $uri $promptally_upstream {
        default 127.0.0.1:3000;
        ~^/api/v1/ 127.0.0.1:8000;
    }

    server {
        listen 127.0.0.1:3001;
        server_name _;
        client_max_body_size 120m;
        client_body_timeout 30s;
        client_header_timeout 15s;

        location / {
            proxy_pass http://$promptally_upstream;
            proxy_http_version 1.1;
            proxy_set_header Host $http_host;
            proxy_set_header Connection "";
            include country.conf;
            # Private, generated ingress credential; never commit this file.
            include proxy-auth.conf;
            proxy_set_header CF-Connecting-IP 127.0.0.1;
            proxy_set_header X-Real-IP 127.0.0.1;
            proxy_set_header X-Forwarded-For "";
            proxy_set_header X-Country-Code "";
            proxy_set_header X-Dev-Country "";
            proxy_set_header X-Internal-Render "";
            proxy_set_header X-Forwarded-Proto https;
            proxy_read_timeout 120s;
        }
    }
}
